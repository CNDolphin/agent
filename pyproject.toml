[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mhagent"
version = "0.1.5"
description = "本地运行的心理健康支持 Agent"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "cryptography>=42",
    "pyyaml>=6",
    "pydantic>=2",
    "pypdf>=4.2",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]
desktop = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pywebview>=5",
]

[tool.setuptools.packages.find]
include = ["mhagent*"]

[tool.setuptools.package-data]
mhagent = ["data/*.json", "data/*.enc", "tools/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "client/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
