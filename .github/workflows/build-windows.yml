name: build-windows-installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    name: 构建 Windows 安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/web/package-lock.json

      - name: 构建前端
        working-directory: client/web
        run: |
          npm ci
          npm run build

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[desktop]"
          pip install "pyinstaller>=6"

      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y

      - name: 打包并编译安装包
        shell: pwsh
        run: >-
          ./packaging/windows/build.ps1 -SkipWebBuild
          -GatewayBaseUrl ${{ vars.MHAGENT_GATEWAY_BASE_URL || 'http://121.196.163.41/api' }}

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: mhagent-windows-setup
          path: artifacts/*.exe
          if-no-files-found: error
